<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Account &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
    <div class="sidebar" id="sidebar-mount"></div>
    <div class="main-content">
        <div class="header" id="header-mount"></div>

        <section class="section active">
            <h2>My Account</h2>
            <p style="color:#5b6255; margin-bottom:1.2rem; font-size:.9rem;">
                Logged in as <strong id="acct-username"></strong>. Update your own password below.
            </p>
            <form id="form-change-password" style="max-width:420px;">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="cp-current" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="cp-new" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="cp-confirm" required minlength="6">
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/admin-common.js"></script>
<script>renderAdminShell('account', 'My Account');</script>
<script src="js/admin-account.js"></script>
</body>
</html>
