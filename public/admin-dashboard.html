<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
    <div class="sidebar" id="sidebar-mount"></div>
    <div class="main-content">
        <div class="header" id="header-mount"></div>

        <section class="section active">
            <h2>Dashboard</h2>
            <div class="dashboard-grid">
                <div class="card"><h3>Total Students</h3><div class="card-value" id="d-students">—</div></div>
                <div class="card"><h3>Total Teachers</h3><div class="card-value" id="d-teachers">—</div></div>
                <div class="card"><h3>Total Classes</h3><div class="card-value" id="d-classes">—</div></div>
                <div class="card"><h3>Pending Fees</h3><div class="card-value" id="d-fees">—</div></div>
            </div>

            <div class="form-box" style="max-width:360px;">
                <h3 style="color:var(--forest); margin-bottom:.8rem; font-size:1.05rem;">Admissions Status (shown on homepage)</h3>
                <div class="form-group">
                    <select id="admission-status-select">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                        <option value="Opening Soon">Opening Soon</option>
                    </select>
                </div>
                <button type="button" class="btn-submit" id="save-admission-status">Update Status</button>
            </div>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/admin-common.js"></script>
<script>renderAdminShell('dashboard', 'Dashboard');</script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
