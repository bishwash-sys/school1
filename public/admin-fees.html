<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Fees &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
    <div class="sidebar" id="sidebar-mount"></div>
    <div class="main-content">
        <div class="header" id="header-mount"></div>

        <section class="section active">
            <h2>Manage Fees</h2>
            <form id="form-fees">
                <div class="form-row">
                    <div class="form-group"><label>Student Name</label><input type="text" id="f-name" required></div>
                    <div class="form-group"><label>Amount</label><input type="number" id="f-amount" required></div>
                    <div class="form-group"><label>Due Date</label><input type="date" id="f-due"></div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="f-status">
                            <option>Pending</option>
                            <option>Paid</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Add Fee Record</button>
            </form>
            <table>
                <thead><tr><th>Student Name</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="tbl-fees"></tbody>
            </table>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/admin-common.js"></script>
<script>renderAdminShell('fees', 'Manage Fees');</script>
<script src="js/admin-fees.js"></script>
</body>
</html>
