<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Teachers &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="container">
    <div class="sidebar" id="sidebar-mount"></div>
    <div class="main-content">
        <div class="header" id="header-mount"></div>

        <section class="section active">
            <h2>Manage Teachers</h2>
            <form id="form-teachers">
                <div class="form-row">
                    <div class="form-group"><label>Teacher Name</label><input type="text" id="t-name" required></div>
                    <div class="form-group"><label>Subject</label><input type="text" id="t-subject" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="t-email"></div>
                </div>
                <button type="submit" class="btn-submit">Add Teacher</button>
            </form>
            <table>
                <thead><tr><th>Name</th><th>Subject</th><th>Email</th><th>Action</th></tr></thead>
                <tbody id="tbl-teachers"></tbody>
            </table>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/admin-common.js"></script>
<script>renderAdminShell('teachers', 'Manage Teachers');</script>
<script src="js/admin-teachers.js"></script>
</body>
</html>
