<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Student Dashboard &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/student.css">
</head>
<body>

<div class="student-page-wrap">
    <div class="student-topbar" id="student-nav-mount"></div>

    <h2 style="color:var(--forest); font-size:1.3rem; margin-bottom:1.2rem;">Welcome back!</h2>

    <div class="summary-grid">
        <div class="summary-card">
            <h4>Homework</h4>
            <div class="num" id="summary-homework-count">—</div>
            <a href="student-homework.html">View homework &rarr;</a>
        </div>
        <div class="summary-card">
            <h4>Notice Board</h4>
            <div class="num" id="summary-notices-count">—</div>
            <a href="student-notices.html">View notices &rarr;</a>
        </div>
        <div class="summary-card">
            <h4>My Study Groups</h4>
            <div class="num" id="summary-groups-count">—</div>
            <a href="student-groups.html">View groups &rarr;</a>
        </div>
        <div class="summary-card">
            <h4>School Fees</h4>
            <div class="num" style="font-size:1.1rem;">Pay online</div>
            <a id="summary-pay-link" href="pay.html">Pay Fees &rarr;</a>
        </div>
    </div>
</div>

<script src="js/student-common.js"></script>
<script>renderStudentShell('dashboard');</script>
