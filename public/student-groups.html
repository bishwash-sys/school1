<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Study Groups &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/student.css">
<style>
    .uid-display {
        font-family: 'Fraunces', serif;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: .05em;
        color: var(--forest);
        background: #eef4ee;
        border-radius: 8px;
        padding: .7rem 1rem;
        margin: .6rem 0;
    }
    .search-row { display: flex; gap: .6rem; }
    .search-row input { flex: 1; }
    .search-result-card {
        display: flex; justify-content: space-between; align-items: center;
        background: #f8f5ec; border-radius: 8px; padding: .9rem 1.1rem; margin-top: 1rem;
    }
    .friend-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: .7rem 0; border-bottom: 1px solid var(--line);
    }
    .friend-row:last-child { border-bottom: none; }
    .remove-friend-btn {
        background: none; border: 1px solid var(--danger); color: var(--danger);
        padding: .3rem .8rem; border-radius: 6px; font-size: .78rem; cursor: pointer;
    }
    .friend-avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--forest); color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: .88rem; flex-shrink: 0; font-family: 'Fraunces', serif;
    }
    .friend-row { gap: .8rem; }
    .friend-info { flex: 1; }
    .friend-name { font-weight: 600; color: var(--ink); font-size: .92rem; }
    .friend-class { font-size: .78rem; color: #8a9084; }

    .friend-select-list { display: flex; flex-direction: column; gap: .6rem; }
    .friend-select-row {
        display: flex; align-items: center; gap: .8rem;
        border: 1px solid var(--line); border-radius: 8px;
        padding: .7rem 1rem; cursor: pointer;
        transition: border-color .15s, background-color .15s;
    }
    .friend-select-row:hover { border-color: var(--marigold); background: #fdf8ee; }
    .friend-select-row.checked { border-color: var(--forest); background: #eef4ee; }
    .friend-select-row input[type="checkbox"] {
        width: auto; margin: 0; accent-color: var(--forest);
        transform: scale(1.15); cursor: pointer;
    }
</style>
</head>
<body>

<div class="student-page-wrap">
    <div class="student-topbar" id="student-nav-mount"></div>

    <h2 style="color:var(--forest); font-size:1.3rem; margin-bottom:.4rem;">Study Group Chat</h2>
    <p style="color:#5b6255; font-size:.88rem; margin-bottom:1.4rem;">
        Add classmates as friends by searching their UID, then start a group chat. Chats are visible to school admins for safety.
    </p>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:1.2rem; margin-bottom:1.5rem;">
        <div class="hw-card" style="text-align:center;">
            <h3 style="margin-bottom:.4rem;">My UID</h3>
            <p style="font-size:.8rem; color:#8a9084;">Share this number so classmates can add you.</p>
            <div class="uid-display" id="my-uid-display">------</div>
        </div>

        <div class="hw-card">
            <h3 style="margin-bottom:.8rem;">Add a Friend</h3>
            <div class="search-row">
                <input type="text" id="uid-search-input" placeholder="Enter a 6-digit UID" maxlength="6" inputmode="numeric">
                <button class="btn" id="uid-search-btn" type="button">Search</button>
            </div>
            <div id="search-result"></div>
            <p id="search-status" style="font-size:.85rem; margin-top:.6rem; color:#5b6255;"></p>
        </div>
    </div>

    <div class="hw-card" style="margin-bottom:1.5rem;">
        <h3 style="margin-bottom:.8rem;">My Friends</h3>
        <div id="friends-list"></div>
    </div>

    <div class="hw-card">
        <h3 style="margin-bottom:.8rem;">Create a Group Chat</h3>
        <p style="font-size:.85rem; color:#8a9084; margin-bottom:.6rem;">Select from friends you've added.</p>
        <div id="contacts-checklist" style="margin-bottom:1rem;"></div>
        <div class="form-group" style="margin-bottom:.8rem;">
            <input type="text" id="group-name-input" placeholder="Group name (e.g. Class 10 Study Group)">
        </div>
        <button class="btn" id="create-group-btn" type="button">Create Group</button>
    </div>

    <h3 style="color:var(--forest); font-size:1.1rem; margin:1.8rem 0 1rem;">My Groups</h3>
    <div id="groups-list"></div>
</div>

<script src="js/student-common.js"></script>
<script>renderStudentShell('groups');</script>
<script src="js/student-groups.js"></script>
</body>
</html>
