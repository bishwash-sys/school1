<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login &mdash; Shree Navajagriti Chandi School</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="emblem">SN</div>
        <h1>Student Login</h1>
        <p class="sub">Check your homework and pay fees</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="studentLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>

        <p style="font-size:.8rem; color:#8a9084; margin-top:1rem;">Don't have a login? Ask the school office for your username and password.</p>
        <a href="index.html" class="back-link">&larr; Back to school website</a>
    </div>

    <script src="js/student-login.js"></script>
</body>
</html>
